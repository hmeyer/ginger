[package]
name = "ginger-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
rppal = "0.22"
thiserror = "2"
libcamera = "0.7"

# Web server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[[bin]]
name = "ginger"
path = "src/bin/main.rs"

[[example]]
name = "drive_test"

[[example]]
name = "camera_test"

[[example]]
name = "test_all"
