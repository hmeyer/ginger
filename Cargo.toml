[workspace]
members = [".", "crates/fast", "crates/slam-core"]
resolver = "2"

[package]
name = "ginger-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
ginger-fast = { path = "crates/fast" }
ginger-slam-core = { path = "crates/slam-core" }
rppal = "0.22"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
libcamera = "0.7"

# Web server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
futures = "0.3"
rayon = "1"
webrtc = "0.17"
v4l = "0.14"
libc = "0.2.186"

[[bin]]
name = "ginger"
path = "src/bin/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
