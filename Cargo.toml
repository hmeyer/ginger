[package]
name = "ginger-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
rppal = "0.22"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
libcamera = "0.7"

# Web server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
webrtc = "0.17"
v4l = "0.14"
libc = "0.2.186"

[[bin]]
name = "ginger"
path = "src/bin/main.rs"

[[example]]
name = "drive_test"

[[example]]
name = "camera_test"

[[example]]
name = "test_all"
