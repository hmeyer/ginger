[workspace]
members = [".", "crates/fast", "crates/slam-core"]
resolver = "2"

[package]
name = "ginger-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
ginger-fast = { path = "crates/fast" }
ginger-slam-core = { path = "crates/slam-core" }
# Seeded RNG: `SmallRng` (Xoshiro256++) for the buzzer/LED show, the
# BRIEF sampling pattern, and frontend test fixtures. Reproducible
# within a build (same binary + same seed → same stream); cross-`rand`-
# version byte stability is not promised, and per the test audit
# (see PLAN.md) nothing in this codebase's tests asserts on specific
# bit sequences.
rand = "0.10"
nalgebra = "0.34"
rppal = "0.22"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
# Used for the motor-model persistence file (`motor-model.toml`) — see
# `src/motion/model.rs`. Already a transitive dep via `ginger-slam-core`
# (where it parses `slam.toml`); promoting it to a direct dep here so the
# main crate doesn't rely on a transitive path.
toml = "0.8"
libcamera = { version = "0.7", optional = true }

# Web server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
futures = "0.3"
rayon = "1"
webrtc = "0.17"
v4l = "0.14"
libc = "0.2.186"
# Tiny pure-Rust JPEG encoder for /api/camera/frame (debug stills).
# Pure-Rust → no system libjpeg dep, works in the CI container as-is.
jpeg-encoder = "0.6"

[dev-dependencies]
# In-process HTTP testing of the axum router (`tower`'s `oneshot`).
tower = "0.5"
# Temp files for motor-model persistence round-trip tests.
tempfile = "3"

# `libcamera` is the only system-coupled dep; making it an opt-out
# default feature lets CI / dev machines build and run the full crate
# (server, slam frontend, replay harness) headless with a mock camera,
# while the Pi build stays a plain `cargo build` (default on).
[features]
default = ["libcamera"]
libcamera = ["dep:libcamera"]

[[bin]]
name = "ginger"
path = "src/bin/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
