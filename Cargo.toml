[workspace]
members = [".", "crates/fast", "crates/rand", "crates/slam-core"]
resolver = "2"

[package]
name = "ginger-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
ginger-fast = { path = "crates/fast" }
ginger-rand = { path = "crates/rand" }
ginger-slam-core = { path = "crates/slam-core" }
nalgebra = "0.34"
rppal = "0.22"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
libcamera = { version = "0.7", optional = true }

# Web server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
futures = "0.3"
rayon = "1"
webrtc = "0.17"
v4l = "0.14"
libc = "0.2.186"

# `libcamera` is the only system-coupled dep; making it an opt-out
# default feature lets CI / dev machines build and run the full crate
# (server, slam frontend, replay harness) headless with a mock camera,
# while the Pi build stays a plain `cargo build` (default on).
[features]
default = ["libcamera"]
libcamera = ["dep:libcamera"]

[[bin]]
name = "ginger"
path = "src/bin/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
