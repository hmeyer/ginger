<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ginger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#111;--bg2:#161625;--bg3:#1e1e1e;--border:#2a2a3e;
  --accent:#4af;--ok:#4f4;--err:#f44;--warn:#f90;
  --text:#eee;--dim:#888;--dim2:#555;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}

/* ── MOBILE FIRST ─────────────────────────────────────────────────────────── */
body{
  display:flex;flex-direction:column;
  height:100dvh;overflow:hidden;touch-action:none
}

/* Header */
header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 12px;height:44px;flex-shrink:0;
  display:flex;align-items:center;gap:10px
}
header h1{font-size:1rem;font-weight:600;letter-spacing:.05em}
#conn{font-size:.72rem;color:var(--dim);margin-left:auto;padding:3px 8px;border-radius:10px;background:#222}
#conn.ok{color:var(--ok);background:#143}
#conn.err{color:var(--err);background:#311}
#explore-badge{
  font-size:.7rem;padding:3px 8px;border-radius:10px;background:#222;color:var(--dim);
  display:none
}
#explore-badge.scanning{display:inline;color:#4af;background:#102030}
#explore-badge.moving  {display:inline;color:#4f4;background:#102010}
#explore-badge.turning {display:inline;color:#f90;background:#201500}
#explore-badge.stuck   {display:inline;color:#f44;background:#200808}
#explore-badge.complete{display:inline;color:#4f4;background:#102010}

/* Camera */
#cam-wrap{flex:1;min-height:0;background:#000;overflow:hidden;position:relative}
#cam{width:100%;height:100%;object-fit:contain;display:block}

/* Minimap overlay */
#minimap-wrap{
  position:absolute;bottom:8px;right:8px;
  width:160px;height:160px;
  border:1px solid rgba(255,255,255,.2);border-radius:6px;
  overflow:hidden;background:#0e0e1c;
  box-shadow:0 2px 8px rgba(0,0,0,.6);
  cursor:pointer;
  transition:opacity .2s
}
#minimap-wrap.hidden{opacity:0;pointer-events:none}
#minimap{width:160px;height:160px;image-rendering:pixelated}
#minimap-toggle{
  position:absolute;bottom:8px;right:176px;
  background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);
  border-radius:6px;color:#aaa;font-size:.7rem;padding:3px 7px;
  cursor:pointer;white-space:nowrap
}
#minimap-toggle:hover{color:#fff}

/* Sensor strip — mobile only */
#sensor-strip{
  background:var(--bg2);border-top:1px solid var(--border);
  display:flex;align-items:center;height:40px;flex-shrink:0;
  padding:0 8px;gap:10px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none
}
#sensor-strip::-webkit-scrollbar{display:none}
.sv{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:.78rem;flex-shrink:0}
.sv .lbl{color:var(--dim);font-size:.7rem}
.sv .val{font-family:monospace;color:var(--accent)}
.sv .unit{color:var(--dim2);font-size:.7rem}
.sv-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.sv input[type=checkbox]{accent-color:var(--accent);cursor:pointer;width:13px;height:13px}
/* IR dots */
.dots{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;background:#2a2a2a;border:1px solid #333;transition:background .1s,box-shadow .1s;flex-shrink:0}
.dot.on{background:var(--warn);box-shadow:0 0 5px #f90a}

/* Sidebar — hidden on mobile, shown on desktop via media query */
aside{display:none}

/* Footer controls */
footer{
  background:var(--bg2);border-top:1px solid var(--border);
  flex-shrink:0;padding:8px 10px 12px;
  display:flex;align-items:center;gap:10px
}

/* D-pad */
.dpad{
  display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);
  gap:4px;flex-shrink:0
}
.dpad button{
  background:#252535;border:1px solid #3a3a5a;border-radius:8px;
  color:#ccc;font-size:1.3rem;cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none;
  display:flex;align-items:center;justify-content:center;transition:background .08s
}
.dpad .gap{background:transparent;border:none;pointer-events:none}
.dpad button.held,.dpad button:active{background:var(--accent);color:#000;border-color:var(--accent)}

/* Right-side controls */
.right-controls{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.sliders{display:flex;flex-direction:column;gap:4px}
.sliders label{font-size:.68rem;color:var(--dim);display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent);height:6px;cursor:pointer}
.leds{display:flex;align-items:center;gap:6px}
.leds>.lbl{font-size:.68rem;color:var(--dim)}
input[type=color]{width:30px;height:30px;border:1px solid #444;border-radius:6px;cursor:pointer;background:none;padding:2px;flex-shrink:0}
.btn-row{display:flex;gap:6px;flex:1}
.btn{
  background:#252535;border:1px solid #3a3a5a;border-radius:6px;
  color:#ccc;padding:6px 10px;cursor:pointer;font-size:.78rem;
  white-space:nowrap;touch-action:manipulation;flex:1;text-align:center
}
.btn:active,.btn:hover{background:#30305a}
.btn.warn{border-color:var(--warn)}
.btn.warn:active{background:var(--warn);color:#000}

/* ── DESKTOP (≥ 700 px) ───────────────────────────────────────────────────── */
@media (min-width: 700px) {
  body{display:grid;grid-template-rows:44px 1fr 100px;grid-template-columns:1fr;overflow:hidden;touch-action:auto}

  /* Camera + sidebar in a row */
  #cam-wrap{display:grid;grid-template-columns:1fr 260px;grid-row:2;grid-column:1;overflow:hidden;background:transparent;flex:unset;min-height:0}
  #cam{background:#000}

  /* Hide mobile-only strip */
  #sensor-strip{display:none}

  /* Show sidebar */
  aside{
    display:flex;flex-direction:column;gap:8px;
    background:#161616;border-left:1px solid var(--border);
    overflow-y:auto;padding:10px;grid-column:2
  }
  .card{background:var(--bg3);border-radius:8px;padding:10px}
  .card-title{
    font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);
    margin-bottom:8px;display:flex;align-items:center;justify-content:space-between
  }
  .card-title label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .card-title input[type=checkbox]{accent-color:var(--accent);cursor:pointer}
  .row{display:flex;align-items:center;gap:8px;padding:2px 0;font-size:.85rem}
  .lbl{color:var(--dim);min-width:18px}

  footer{height:100px;padding:10px 16px;grid-row:3;grid-column:1}
  .dpad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}
  .dpad button{font-size:1.1rem;border-radius:6px}
}
</style>
</head>
<body>

<header>
  <h1>🤖 Ginger</h1>
  <span style="font-size:.65rem;color:#777;margin-left:2px">build: {{BUILD_TIME}}</span>
  <span id="explore-badge"></span>
  <span id="conn">connecting…</span>
</header>

<!-- Camera takes available height; on desktop becomes a grid container -->
<div id="cam-wrap">
  <img id="cam" alt="camera feed">
  <button id="minimap-toggle" title="Toggle map">🗺 map</button>
  <div id="minimap-wrap">
    <canvas id="minimap" width="160" height="160"></canvas>
  </div>

  <!-- Sidebar (inside cam-wrap so it sits beside camera on desktop) -->
  <aside>
    <div class="card">
      <div class="card-title">Battery</div>
      <div class="row">
        <span class="val" id="v-bat">—</span><span style="color:var(--dim2)">V</span>
        <span class="val" id="v-bat-pct" style="margin-left:6px;font-size:.85rem">—%</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">
        Camera
        <button id="exp-mode-btn" style="font-size:.65rem;padding:2px 8px;background:#252535;border:1px solid #3a3a5a;border-radius:4px;color:#ccc;cursor:pointer">Auto</button>
      </div>
      <div class="row"><span class="lbl" style="min-width:32px">onbd</span><span class="val" id="v-cam-ofps">—</span><span style="color:var(--dim2);font-size:.8rem">fps</span></div>
      <div class="row"><span class="lbl" style="min-width:32px">web</span><span class="val" id="v-cam-wfps">—</span><span style="color:var(--dim2);font-size:.8rem">fps</span></div>
      <div class="row"><span class="lbl" style="min-width:32px">luma</span><span class="val" id="v-luma">—</span></div>
      <div class="row"><span class="lbl" style="min-width:32px">exp</span><span class="val" id="v-exp">—</span><span style="color:var(--dim2);font-size:.8rem">ms</span></div>
      <div class="row"><span class="lbl" style="min-width:32px">gain</span><span class="val" id="v-gain">—</span><span style="color:var(--dim2);font-size:.8rem">×</span></div>
      <div id="exp-auto-ctrl" style="margin-top:6px">
        <label style="font-size:.68rem;color:var(--dim);display:flex;justify-content:space-between">Target luma <span id="v-target-luma">128</span></label>
        <input type="range" id="target-luma" min="32" max="220" value="128">
      </div>
      <div id="exp-manual-ctrl" style="margin-top:6px;display:none">
        <label style="font-size:.68rem;color:var(--dim);display:flex;justify-content:space-between">Exposure <span id="v-exp-slider">8.0</span>ms</label>
        <input type="range" id="exp-slider" min="500" max="100000" step="500" value="8000">
        <label style="font-size:.68rem;color:var(--dim);display:flex;justify-content:space-between;margin-top:4px">Gain <span id="v-gain-slider">8.0</span>×</label>
        <input type="range" id="gain-slider" min="1" max="16" step="0.5" value="8">
      </div>
    </div>
    <div class="card">
      <div class="card-title">
        <label><input type="checkbox" id="en-light" checked>Light sensors</label>
      </div>
      <div class="row"><span class="lbl">L</span><span class="val" id="v-ll">—</span><span style="color:var(--dim2);font-size:.8rem">V</span></div>
      <div class="row"><span class="lbl">R</span><span class="val" id="v-lr">—</span><span style="color:var(--dim2);font-size:.8rem">V</span></div>
    </div>
    <div class="card">
      <div class="card-title">
        <label><input type="checkbox" id="en-ir" checked>Infrared</label>
      </div>
      <div class="row">
        <div class="dots">
          <div class="dot" id="ir-l"></div>
          <div class="dot" id="ir-c"></div>
          <div class="dot" id="ir-r"></div>
        </div>
        <span style="color:var(--dim2);font-size:.75rem">L · C · R</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">
        <label><input type="checkbox" id="en-us" checked>Ultrasonic</label>
      </div>
      <div class="row"><span class="val" id="v-us">—</span><span style="color:var(--dim2)">cm</span></div>
      <div class="row"><span class="lbl" style="min-width:32px">TTC</span><span class="val" id="v-ttc">—</span><span style="color:var(--dim2);font-size:.8rem">s</span></div>
    </div>
  </aside>
</div>

<!-- Mobile sensor strip (hidden on desktop) -->
<div id="sensor-strip">
  <div class="sv">
    <span class="lbl">onbd</span>
    <span class="val" id="v-cam-ofps-m">—</span>
    <span class="unit">fps</span>
  </div>
  <div class="sv-sep"></div>
  <div class="sv">
    <span class="lbl">web</span>
    <span class="val" id="v-cam-wfps-m">—</span>
    <span class="unit">fps</span>
  </div>
  <div class="sv-sep"></div>
  <div class="sv">
    <span class="lbl">BAT</span>
    <span class="val" id="v-bat-m">—</span>
    <span class="unit">V</span>
    <span class="val" id="v-bat-pct-m" style="font-size:.7rem;color:#888">—%</span>
  </div>
  <div class="sv-sep"></div>
  <div class="sv">
    <input type="checkbox" id="en-light-m" checked title="Toggle light sensors">
    <span class="lbl">L</span><span class="val" id="v-ll-m">—</span>
    <span class="lbl" style="margin-left:3px">R</span><span class="val" id="v-lr-m">—</span>
    <span class="unit">V</span>
  </div>
  <div class="sv-sep"></div>
  <div class="sv">
    <input type="checkbox" id="en-us-m" checked title="Toggle ultrasonic">
    <span class="lbl">US</span>
    <span class="val" id="v-us-m">—</span>
    <span class="unit">cm</span>
    <span class="lbl" style="margin-left:4px">TTC</span>
    <span class="val" id="v-ttc-m">—</span>
    <span class="unit">s</span>
  </div>
  <div class="sv-sep"></div>
  <div class="sv">
    <input type="checkbox" id="en-ir-m" checked title="Toggle IR">
    <div class="dots">
      <div class="dot" id="ir-l-m"></div>
      <div class="dot" id="ir-c-m"></div>
      <div class="dot" id="ir-r-m"></div>
    </div>
  </div>
</div>

<footer>
  <div class="dpad">
    <div class="gap"></div>
    <button id="b-fwd">↑</button>
    <div class="gap"></div>
    <button id="b-left">←</button>
    <button id="b-stop">■</button>
    <button id="b-right">→</button>
    <div class="gap"></div>
    <button id="b-bwd">↓</button>
    <div class="gap"></div>
  </div>

  <div class="right-controls">
    <div class="sliders">
      <label>Pan <span id="pan-v">90</span>°</label>
      <input type="range" id="pan" min="0" max="180" value="90">
      <label>Tilt <span id="tilt-v">90</span>°</label>
      <input type="range" id="tilt" min="0" max="180" value="90">
    </div>
    <div class="leds">
      <span class="lbl">LED</span>
      <input type="color" id="led-color" value="#00aaff">
      <div class="btn-row">
        <button class="btn" id="b-led-set">Set</button>
        <button class="btn" id="b-led-off">Off</button>
        <button class="btn warn" id="b-buzz">🔊 Beep</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="b-scan">Scan</button>
        <button class="btn" id="b-explore" style="border-color:#4f4;color:#4f4">Explore</button>
      </div>
    </div>
  </div>
</footer>

<script>
const DUTY = 2000;
let driveTimer = null;

function post(url, body) {
  return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
}

// ── Drive ─────────────────────────────────────────────────────────────────────
function startDrive(l, r) {
  clearInterval(driveTimer);
  post('/api/drive', {left:l, right:r});
  driveTimer = setInterval(() => post('/api/drive', {left:l, right:r}), 150);
}
function stopDrive() {
  clearInterval(driveTimer);
  driveTimer = null;
  post('/api/stop');
}
function bindDrive(id, l, r) {
  const el = document.getElementById(id);
  const press = e => { e.preventDefault(); el.classList.add('held'); startDrive(l, r); };
  const rel   = () => { el.classList.remove('held'); stopDrive(); };
  el.addEventListener('mousedown', press);
  el.addEventListener('touchstart', press, {passive:false});
  ['mouseup','touchend','mouseleave','touchcancel'].forEach(ev => el.addEventListener(ev, rel));
}
bindDrive('b-fwd',   DUTY,  DUTY);
bindDrive('b-bwd',  -DUTY, -DUTY);
bindDrive('b-left',  DUTY, -DUTY);
bindDrive('b-right', -DUTY,  DUTY);
document.getElementById('b-stop').addEventListener('click', stopDrive);
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key==='ArrowUp')    startDrive( DUTY,  DUTY);
  if (e.key==='ArrowDown')  startDrive(-DUTY, -DUTY);
  if (e.key==='ArrowLeft')  startDrive( DUTY, -DUTY);
  if (e.key==='ArrowRight') startDrive(-DUTY,  DUTY);
  if (e.key===' ') { e.preventDefault(); stopDrive(); }
});
document.addEventListener('keyup', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) stopDrive();
});

// ── Pan / Tilt ────────────────────────────────────────────────────────────────
document.getElementById('pan').addEventListener('input', e => {
  document.getElementById('pan-v').textContent = e.target.value;
  post('/api/pan', {angle: +e.target.value});
});
document.getElementById('tilt').addEventListener('input', e => {
  document.getElementById('tilt-v').textContent = e.target.value;
  post('/api/tilt', {angle: +e.target.value});
});

// ── LED ───────────────────────────────────────────────────────────────────────
document.getElementById('b-led-set').addEventListener('click', () => {
  const h = document.getElementById('led-color').value;
  post('/api/led', {r:parseInt(h.slice(1,3),16), g:parseInt(h.slice(3,5),16), b:parseInt(h.slice(5,7),16)});
});
document.getElementById('b-led-off').addEventListener('click', () => post('/api/led/off'));

// ── Buzzer ───────────────────────────────────────────────────────────────────
const bz = document.getElementById('b-buzz');
const bzOn  = e => { e.preventDefault(); post('/api/buzzer', {on:true}); };
const bzOff = () => post('/api/buzzer', {on:false});
bz.addEventListener('mousedown',  bzOn);
bz.addEventListener('touchstart', bzOn, {passive:false});
['mouseup','touchend','mouseleave','touchcancel'].forEach(ev => bz.addEventListener(ev, bzOff));

// ── Sensor config ─────────────────────────────────────────────────────────────
function sendConfig() {
  post('/api/sensors/config', {
    light: document.getElementById('en-light').checked,
    ir:    document.getElementById('en-ir').checked,
    us:    document.getElementById('en-us').checked,
  });
}

// Sync mobile strips ↔ desktop sidebar
function syncCheckbox(desktopId, mobileId) {
  const d = document.getElementById(desktopId);
  const m = document.getElementById(mobileId);
  if (d) d.addEventListener('change', () => { if (m) m.checked = d.checked; sendConfig(); });
  if (m) m.addEventListener('change', () => { if (d) d.checked = m.checked; sendConfig(); });
}
syncCheckbox('en-light', 'en-light-m');
syncCheckbox('en-ir',    'en-ir-m');
syncCheckbox('en-us',    'en-us-m');

// ── SSE sensor stream ─────────────────────────────────────────────────────────
const conn = document.getElementById('conn');
const sse  = new EventSource('/api/sensors/stream');
sse.onopen  = () => { conn.textContent = 'connected'; conn.className = 'ok'; };
sse.onerror = () => { conn.textContent = 'disconnected'; conn.className = 'err'; };
sse.onmessage = e => {
  const d = JSON.parse(e.data);
  const fmt = (v, n) => v != null ? v.toFixed(n) : '—';

  // Explore state badge
  const es = d.explore_state || 'idle';
  exploreBadge.textContent = es;
  exploreBadge.className   = es;
  if (es === 'idle' || es === 'complete') {
    setExploring(false);
  } else {
    setExploring(true);
  }

  // Onboard camera FPS (from SSE)
  const ofps = d.camera_fps != null ? d.camera_fps.toFixed(1) : '—';
  document.getElementById('v-cam-ofps').textContent   = ofps;
  document.getElementById('v-cam-ofps-m').textContent = ofps;

  // Exposure readback
  if (d.luma != null)       document.getElementById('v-luma').textContent = d.luma;
  if (d.exposure_us != null) document.getElementById('v-exp').textContent  = (d.exposure_us / 1000).toFixed(1);
  if (d.gain != null)       document.getElementById('v-gain').textContent  = d.gain.toFixed(1);
  if (d.exposure_mode != null && d.exposure_mode !== expMode) setExpMode(d.exposure_mode, false);

  // Update desktop sidebar IDs (also read by Playwright at 1280px)
  document.getElementById('v-bat').textContent     = fmt(d.battery_v, 2);
  document.getElementById('v-bat-pct').textContent = d.battery_pct != null ? d.battery_pct + '%' : '—%';
  document.getElementById('v-ll').textContent  = fmt(d.light_left, 2);
  document.getElementById('v-lr').textContent  = fmt(d.light_right, 2);
  document.getElementById('v-us').textContent  = fmt(d.us_cm, 1);
  {
    const ttc = d.ttc_s;
    const txt = ttc != null ? ttc.toFixed(1) : '—';
    const col = ttc == null ? '' : ttc < 1 ? 'var(--err)' : ttc < 2 ? 'var(--warn)' : 'var(--ok)';
    ['v-ttc','v-ttc-m'].forEach(id => {
      const el = document.getElementById(id);
      el.textContent = txt;
      el.style.color = col;
    });
  }
  if (d.ir) {
    document.getElementById('ir-l').className = 'dot' + (d.ir[0] ? ' on' : '');
    document.getElementById('ir-c').className = 'dot' + (d.ir[1] ? ' on' : '');
    document.getElementById('ir-r').className = 'dot' + (d.ir[2] ? ' on' : '');
  } else {
    ['ir-l','ir-c','ir-r'].forEach(id => document.getElementById(id).className = 'dot');
  }

  // Update mobile strip IDs
  document.getElementById('v-bat-m').textContent     = fmt(d.battery_v, 2);
  document.getElementById('v-bat-pct-m').textContent = d.battery_pct != null ? d.battery_pct + '%' : '—%';
  document.getElementById('v-ll-m').textContent  = fmt(d.light_left, 2);
  document.getElementById('v-lr-m').textContent  = fmt(d.light_right, 2);
  document.getElementById('v-us-m').textContent  = fmt(d.us_cm, 1);
  if (d.ir) {
    document.getElementById('ir-l-m').className = 'dot' + (d.ir[0] ? ' on' : '');
    document.getElementById('ir-c-m').className = 'dot' + (d.ir[1] ? ' on' : '');
    document.getElementById('ir-r-m').className = 'dot' + (d.ir[2] ? ' on' : '');
  } else {
    ['ir-l-m','ir-c-m','ir-r-m'].forEach(id => document.getElementById(id).className = 'dot');
  }
};

// ── Scan button ───────────────────────────────────────────────────────────────
const scanBtn = document.getElementById('b-scan');
scanBtn.addEventListener('click', () => {
  scanBtn.disabled = true;
  scanBtn.textContent = 'Scanning…';
  post('/api/scan').then(() => {
    setTimeout(() => { scanBtn.disabled = false; scanBtn.textContent = 'Scan'; }, 3000);
    setTimeout(updateMinimap, 3200);
  });
});

// ── Explore button ────────────────────────────────────────────────────────────
const exploreBtn   = document.getElementById('b-explore');
const exploreBadge = document.getElementById('explore-badge');
let exploring = false;

exploreBtn.addEventListener('click', () => {
  if (exploring) {
    post('/api/explore/stop');
    setExploring(false);
  } else {
    post('/api/explore/start');
    setExploring(true);
  }
});

function setExploring(active) {
  exploring = active;
  exploreBtn.textContent     = active ? 'Stop' : 'Explore';
  exploreBtn.style.color     = active ? 'var(--err)' : 'var(--ok)';
  exploreBtn.style.borderColor = active ? 'var(--err)' : 'var(--ok)';
  minimapPollMs = active ? 1000 : 2000;
}

// ── Minimap ───────────────────────────────────────────────────────────────────
const minimapCanvas = document.getElementById('minimap');
const minimapCtx    = minimapCanvas.getContext('2d');
const minimapWrap   = document.getElementById('minimap-wrap');
const minimapToggle = document.getElementById('minimap-toggle');
let mapMeta = null;
let minimapVisible = true;

minimapToggle.addEventListener('click', () => {
  minimapVisible = !minimapVisible;
  minimapWrap.classList.toggle('hidden', !minimapVisible);
  minimapToggle.textContent = minimapVisible ? '🗺 map' : '🗺 map';
});

function renderMinimap(mapImg, meta) {
  const SIZE = 160;
  const VIEW = 80; // cells to show (8 m × 8 m)
  minimapCtx.clearRect(0, 0, SIZE, SIZE);

  // Crop map image around robot, scaled to canvas
  const sx = meta.robot_gx - VIEW / 2;
  const sy = meta.robot_gy - VIEW / 2;
  minimapCtx.drawImage(mapImg, sx, sy, VIEW, VIEW, 0, 0, SIZE, SIZE);

  // Robot arrow centred in canvas
  const scale = SIZE / VIEW;
  minimapCtx.save();
  minimapCtx.translate(SIZE / 2, SIZE / 2);
  // heading: 0=north=up, clockwise → subtract 90° for canvas rotation
  minimapCtx.rotate((meta.robot_heading - 90) * Math.PI / 180);
  minimapCtx.fillStyle = '#4af';
  minimapCtx.beginPath();
  minimapCtx.moveTo(0, -8 * scale / 4);
  minimapCtx.lineTo( 5 * scale / 4,  6 * scale / 4);
  minimapCtx.lineTo(-5 * scale / 4,  6 * scale / 4);
  minimapCtx.closePath();
  minimapCtx.fill();
  minimapCtx.restore();
}

async function updateMinimap() {
  try {
    const [metaResp] = await Promise.all([fetch('/api/map')]);
    mapMeta = await metaResp.json();

    const mapImg = new Image();
    mapImg.onload = () => renderMinimap(mapImg, mapMeta);
    mapImg.src = '/api/map/png?' + Date.now();
  } catch (_) {}
}

// Adaptive polling: 2 s idle, 1 s while exploring
let minimapPollMs = 2000;
let minimapTimer  = null;
function scheduleMinimap() {
  clearTimeout(minimapTimer);
  minimapTimer = setTimeout(async () => { await updateMinimap(); scheduleMinimap(); }, minimapPollMs);
}
updateMinimap();
scheduleMinimap();

// ── Exposure control ──────────────────────────────────────────────────────────
let expMode = 'auto';

function setExpMode(mode, sendToServer = true) {
  expMode = mode;
  const btn = document.getElementById('exp-mode-btn');
  btn.textContent = mode === 'auto' ? 'Auto' : 'Manual';
  btn.style.color = mode === 'auto' ? 'var(--accent)' : 'var(--warn)';
  document.getElementById('exp-auto-ctrl').style.display   = mode === 'auto'   ? '' : 'none';
  document.getElementById('exp-manual-ctrl').style.display = mode === 'manual' ? '' : 'none';
  if (sendToServer) post('/api/camera/exposure', {mode});
}

document.getElementById('exp-mode-btn').addEventListener('click', () => {
  setExpMode(expMode === 'auto' ? 'manual' : 'auto');
});

document.getElementById('target-luma').addEventListener('input', e => {
  document.getElementById('v-target-luma').textContent = e.target.value;
  post('/api/camera/exposure', {target_luma: +e.target.value});
});

document.getElementById('exp-slider').addEventListener('input', e => {
  document.getElementById('v-exp-slider').textContent = (e.target.value / 1000).toFixed(1);
  post('/api/camera/exposure', {manual_exposure_us: +e.target.value});
});

document.getElementById('gain-slider').addEventListener('input', e => {
  document.getElementById('v-gain-slider').textContent = (+e.target.value).toFixed(1);
  post('/api/camera/exposure', {manual_gain: +e.target.value});
});

// ── Camera frame polling + web FPS ────────────────────────────────────────────
const camEl = document.getElementById('cam');
let _wFrames = 0, _wT0 = performance.now(), _wFps = 0;

function updateWebFps() {
  const now = performance.now();
  const dt = (now - _wT0) / 1000;
  if (dt >= 0.5) {
    _wFps = _wFps === 0 ? _wFrames / dt : 0.3 * (_wFrames / dt) + 0.7 * _wFps;
    _wFrames = 0; _wT0 = now;
    const txt = _wFps.toFixed(1);
    document.getElementById('v-cam-wfps').textContent   = txt;
    document.getElementById('v-cam-wfps-m').textContent = txt;
  }
}

function nextFrame() {
  const img = new Image();
  img.onload  = () => { camEl.src = img.src; _wFrames++; updateWebFps(); nextFrame(); };
  img.onerror = () => setTimeout(nextFrame, 500);
  img.src = '/api/camera/frame?' + Date.now();
}
nextFrame();
</script>
