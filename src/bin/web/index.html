<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ginger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#111;--bg2:#161625;--bg3:#1e1e1e;--border:#2a2a3e;
  --accent:#4af;--ok:#4f4;--err:#f44;--warn:#f90;
  --text:#eee;--dim:#888;--dim2:#555;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}

/* ── MOBILE FIRST ─────────────────────────────────────────────────────────── */
body{
  display:flex;flex-direction:column;
  height:100dvh;overflow:hidden;touch-action:none
}

/* Header */
header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 12px;height:44px;flex-shrink:0;
  display:flex;align-items:center;gap:10px
}
header h1{font-size:1rem;font-weight:600;letter-spacing:.05em}
#conn{font-size:.72rem;color:var(--dim);margin-left:auto;padding:3px 8px;border-radius:10px;background:#222}
#conn.ok{color:var(--ok);background:#143}
#conn.err{color:var(--err);background:#311}

/* Camera */
#cam-wrap{flex:1;min-height:0;background:#000;overflow:hidden;position:relative}
#cam{width:100%;height:100%;object-fit:contain;display:block;background:#000}

/* SLAM feature overlay (sits exactly over the video's contained image) */
#feat-overlay{position:absolute;pointer-events:none;z-index:5;left:0;top:0}
#slam-map{
  position:absolute;right:8px;bottom:8px;z-index:6;display:none;
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);
  border-radius:6px
}
#slam-hud{
  position:absolute;left:8px;top:8px;z-index:6;
  display:flex;align-items:center;gap:8px;
  font-size:.7rem;color:#9cf;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);
  border-radius:6px;padding:3px 7px
}
#slam-hud select{
  background:#1a1a28;color:#cde;border:1px solid #3a3a5a;
  border-radius:4px;font-size:.7rem;padding:2px 4px;cursor:pointer
}
#feat-stat{font-family:monospace;color:var(--dim);white-space:pre;line-height:1.35}

/* Sensor strip — mobile only */
#sensor-strip{
  background:var(--bg2);border-top:1px solid var(--border);
  display:flex;align-items:center;height:40px;flex-shrink:0;
  padding:0 8px;gap:10px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none
}
#sensor-strip::-webkit-scrollbar{display:none}
.sv{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:.78rem;flex-shrink:0}
.sv .lbl{color:var(--dim);font-size:.7rem}
.sv .val{font-family:monospace;color:var(--accent)}
.sv .unit{color:var(--dim2);font-size:.7rem}
.sv-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.sv input[type=checkbox]{accent-color:var(--accent);cursor:pointer;width:13px;height:13px}
/* IR dots */
.dots{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;background:#2a2a2a;border:1px solid #333;transition:background .1s,box-shadow .1s;flex-shrink:0}
.dot.on{background:var(--warn);box-shadow:0 0 5px #f90a}

/* Sidebar — hidden on mobile, shown on desktop via media query */
aside{display:none}

/* Footer controls */
footer{
  background:var(--bg2);border-top:1px solid var(--border);
  flex-shrink:0;padding:8px 10px 12px;
  display:flex;align-items:center;gap:10px
}

/* Virtual joysticks */
.joy-block{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
.joy{
  position:relative;width:92px;height:92px;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,#26263f,#15151f);
  border:1px solid #3a3a5a;flex-shrink:0;
  touch-action:none;user-select:none;-webkit-user-select:none;
  cursor:grab;outline:none
}
.joy::after{
  content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;
  margin:-4px 0 0 -4px;border-radius:50%;background:#3a3a5a
}
.joy:active{cursor:grabbing}
.joy.focused{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 14px #4af7}
.joy-knob{
  position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;
  background:#3a3a5a;border:1px solid #6a6aa0;
  transform:translate(-50%,-50%);transition:transform .12s ease-out;
  pointer-events:none
}
.joy.dragging .joy-knob{transition:none;background:var(--accent);border-color:var(--accent)}
.joy-label{font-size:.62rem;color:var(--dim);text-align:center;white-space:nowrap;letter-spacing:.03em}

/* Right-side controls */
.right-controls{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;justify-content:center}
.btn-row{display:flex;gap:8px;justify-content:center}
.btn{
  background:#252535;border:1px solid #3a3a5a;border-radius:6px;
  color:#ccc;padding:6px 10px;cursor:pointer;font-size:.78rem;
  white-space:nowrap;touch-action:manipulation;flex:1;text-align:center
}
.btn:active,.btn:hover{background:#30305a}
.btn.warn{border-color:var(--warn)}
.btn.warn:active{background:var(--warn);color:#000}
/* Express: a compact, content-sized button (don't stretch) */
#b-express{flex:0 0 auto;font-size:1.5rem;line-height:1;padding:10px 18px}

/* ── DESKTOP (≥ 700 px) ───────────────────────────────────────────────────── */
@media (min-width: 700px) {
  body{display:grid;grid-template-rows:44px 1fr 180px;grid-template-columns:1fr;overflow:hidden;touch-action:auto}

  /* Camera + sidebar in a row */
  #cam-wrap{display:grid;grid-template-columns:1fr 260px;grid-row:2;grid-column:1;overflow:hidden;background:transparent;flex:unset;min-height:0}
  #cam{background:#000}

  /* Hide mobile-only strip */
  #sensor-strip{display:none}

  /* Show sidebar */
  aside{
    display:flex;flex-direction:column;gap:8px;
    background:#161616;border-left:1px solid var(--border);
    overflow-y:auto;padding:10px;grid-column:2
  }
  .card{background:var(--bg3);border-radius:8px;padding:10px}
  .card-title{
    font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);
    margin-bottom:8px;display:flex;align-items:center;justify-content:space-between
  }
  .card-title label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .card-title input[type=checkbox]{accent-color:var(--accent);cursor:pointer}
  .row{display:flex;align-items:center;gap:8px;padding:2px 0;font-size:.85rem}
  .lbl{color:var(--dim);min-width:18px}

  footer{height:180px;padding:14px 16px;grid-row:3;grid-column:1;gap:18px}
  .joy{width:140px;height:140px}
  .joy-knob{width:58px;height:58px}
}
</style>
</head>
<body>

<header>
  <h1>🤖 Ginger</h1>
  <span id="build-time" data-iso="{{BUILD_TIME}}" style="font-size:.65rem;color:#777;margin-left:2px">build: {{BUILD_TIME}}</span>
  <span id="conn">connecting…</span>
</header>

<!-- Camera takes available height; on desktop becomes a grid container -->
<div id="cam-wrap">
  <video id="cam" autoplay muted playsinline></video>
  <canvas id="feat-overlay"></canvas>
  <canvas id="slam-map"></canvas>
  <div id="slam-hud">
    <select id="feat-mode" title="Feature overlay">
      <option value="off">feat: off</option>
      <option value="300" selected>FAST: 300</option>
      <option value="all">FAST: all</option>
      <option value="orient">BRIEF: orient</option>
      <option value="match">BRIEF: match</option>
      <option value="both">BRIEF: both</option>
      <option value="map">map (M3)</option>
    </select>
    <span id="feat-stat">—</span>
  </div>

  <!-- Sidebar (inside cam-wrap so it sits beside camera on desktop) -->
  <aside>
    <div class="card">
      <div class="card-title">Battery</div>
      <div class="row">
        <span class="val" id="v-bat">—</span><span style="color:var(--dim2)">V</span>
        <span class="val" id="v-bat-pct" style="margin-left:6px;font-size:.85rem">—%</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Camera</div>
      <div class="row"><span class="lbl" style="min-width:32px">onbd</span><span class="val" id="v-cam-ofps">—</span><span style="color:var(--dim2);font-size:.8rem">fps</span></div>
      <div class="row"><span class="lbl" style="min-width:32px">web</span><span class="val" id="v-cam-wfps">—</span><span style="color:var(--dim2);font-size:.8rem">fps</span></div>
      <div class="row"><span class="lbl" style="min-width:32px">luma</span><span class="val" id="v-luma">—</span></div>
      <div class="row"><span class="lbl" style="min-width:32px">bri</span><span class="val" id="v-bri">—</span><span style="color:var(--dim2);font-size:.8rem">EV</span></div>
      <div class="row"><span class="lbl" style="min-width:32px">exp</span><span class="val" id="v-exp">—</span><span style="color:var(--dim2);font-size:.8rem">ms</span></div>
      <div class="row"><span class="lbl" style="min-width:32px">gain</span><span class="val" id="v-gain">—</span><span style="color:var(--dim2);font-size:.8rem">×</span></div>
    </div>
    <div class="card">
      <div class="card-title">
        <label><input type="checkbox" id="en-light" checked>Light sensors</label>
      </div>
      <div class="row"><span class="lbl">L</span><span class="val" id="v-ll">—</span><span style="color:var(--dim2);font-size:.8rem">V</span></div>
      <div class="row"><span class="lbl">R</span><span class="val" id="v-lr">—</span><span style="color:var(--dim2);font-size:.8rem">V</span></div>
    </div>
    <div class="card">
      <div class="card-title">
        <label><input type="checkbox" id="en-ir" checked>Infrared</label>
      </div>
      <div class="row">
        <div class="dots">
          <div class="dot" id="ir-l"></div>
          <div class="dot" id="ir-c"></div>
          <div class="dot" id="ir-r"></div>
        </div>
        <span style="color:var(--dim2);font-size:.75rem">L · C · R</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">
        <label><input type="checkbox" id="en-us" checked>Ultrasonic</label>
      </div>
      <div class="row"><span class="val" id="v-us">—</span><span style="color:var(--dim2)">cm</span></div>
      <div class="row"><span class="lbl" style="min-width:32px">TTC</span><span class="val" id="v-ttc">—</span><span style="color:var(--dim2);font-size:.8rem">s</span></div>
    </div>
  </aside>
</div>

<!-- Mobile sensor strip (hidden on desktop) -->
<div id="sensor-strip">
  <div class="sv">
    <span class="lbl">onbd</span>
    <span class="val" id="v-cam-ofps-m">—</span>
    <span class="unit">fps</span>
  </div>
  <div class="sv-sep"></div>
  <div class="sv">
    <span class="lbl">web</span>
    <span class="val" id="v-cam-wfps-m">—</span>
    <span class="unit">fps</span>
  </div>
  <div class="sv-sep"></div>
  <div class="sv">
    <span class="lbl">BAT</span>
    <span class="val" id="v-bat-m">—</span>
    <span class="unit">V</span>
    <span class="val" id="v-bat-pct-m" style="font-size:.7rem;color:#888">—%</span>
  </div>
  <div class="sv-sep"></div>
  <div class="sv">
    <input type="checkbox" id="en-light-m" checked title="Toggle light sensors">
    <span class="lbl">L</span><span class="val" id="v-ll-m">—</span>
    <span class="lbl" style="margin-left:3px">R</span><span class="val" id="v-lr-m">—</span>
    <span class="unit">V</span>
  </div>
  <div class="sv-sep"></div>
  <div class="sv">
    <input type="checkbox" id="en-us-m" checked title="Toggle ultrasonic">
    <span class="lbl">US</span>
    <span class="val" id="v-us-m">—</span>
    <span class="unit">cm</span>
    <span class="lbl" style="margin-left:4px">TTC</span>
    <span class="val" id="v-ttc-m">—</span>
    <span class="unit">s</span>
  </div>
  <div class="sv-sep"></div>
  <div class="sv">
    <input type="checkbox" id="en-ir-m" checked title="Toggle IR">
    <div class="dots">
      <div class="dot" id="ir-l-m"></div>
      <div class="dot" id="ir-c-m"></div>
      <div class="dot" id="ir-r-m"></div>
    </div>
  </div>
</div>

<footer>
  <div class="joy-block">
    <div class="joy" id="drive-joy" tabindex="0" role="application"
         aria-label="Drive joystick — click or tap to focus, then steer with the arrow keys; space stops">
      <div class="joy-knob"></div>
    </div>
    <div class="joy-label" id="drive-hint">Drive · tap to focus</div>
  </div>

  <div class="joy-block">
    <div class="joy" id="cam-joy" role="application"
         aria-label="Camera bracket joystick — drag to pan/tilt; releases back to forward">
      <div class="joy-knob"></div>
    </div>
    <div class="joy-label">Pan <span id="pan-v">90</span>° · Tilt <span id="tilt-v">90</span>°</div>
  </div>

  <div class="right-controls">
    <div class="btn-row">
      <button class="btn" id="b-express">🤖✨</button>
    </div>
  </div>
</footer>

<script>
const DUTY = 2000;
// Joystick response curve. The motors are very non-linear (almost no
// motion at low duty, then a sharp ramp), so a linear stick feels
// near-binary. `curve` cubically softens the low/mid range — most of the
// throw gives gentle output, full only near the rim. k: 0 = linear, 1 = max.
const curve = (v, k) => {
  const s = Math.sign(v), a = Math.abs(v);
  return s * (k * a * a * a + (1 - k) * a);
};
const DRIVE_EXPO = 0.7;   // forward/back softening
// Steering needs a stronger curve *and* a lower ceiling: at full duty a
// small turn input swings the wheels hard enough to feel on/off, and
// in-place spin is too fast. TURN_GAIN caps yaw authority.
const TURN_EXPO  = 0.85;
const TURN_GAIN  = 0.55;
let driveTimer = null;

function post(url, body) {
  return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
}

// ── Build time → viewer's local timezone ──────────────────────────────────────
// build.rs stamps an ISO-8601 UTC instant; render it in local time.
(() => {
  const el = document.getElementById('build-time');
  const d = new Date(el.dataset.iso);
  if (!isNaN(d)) el.textContent = 'build: ' + d.toLocaleString(undefined, {
    year: 'numeric', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit', timeZoneName: 'short',
  });
})();

// ── Virtual joystick ──────────────────────────────────────────────────────────
// Pointer-driven analog stick. Always springs back to center on release
// (drive: stop; camera bracket: face forward); `onEnd` fires on release.
function makeJoystick(el, { onMove, onEnd }) {
  const knob = el.querySelector('.joy-knob');
  let dragging = false, pid = null, raf = 0, pending = null;

  const radius = () => Math.max(1, el.clientWidth / 2 - knob.clientWidth / 2);
  function place(nx, ny) {
    if (nx === 0 && ny === 0) { center(); return; }
    const R = radius();
    knob.style.transform =
      `translate(calc(-50% + ${(nx * R).toFixed(1)}px), calc(-50% + ${(ny * R).toFixed(1)}px))`;
  }
  function center() { knob.style.transform = 'translate(-50%, -50%)'; }
  function emit(nx, ny) {
    pending = [nx, ny];
    if (!raf) raf = requestAnimationFrame(() => {
      raf = 0;
      // Mobile coalesces/defers rAF: this can fire after release. Only
      // emit while still dragging, or a stale frame re-arms the drive
      // heartbeat with no finger down (the "sticky on mobile" bug).
      if (dragging && pending && onMove) onMove(pending[0], pending[1]);
    });
  }
  function vec(e) {
    const r = el.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2);
    let dy = e.clientY - (r.top + r.height / 2);
    const R = radius(), d = Math.hypot(dx, dy);
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    return [dx / R, dy / R];
  }
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (el.tabIndex >= 0) el.focus();
    dragging = true; pid = e.pointerId;
    try { el.setPointerCapture(pid); } catch (_) {}
    el.classList.add('dragging');
    const [nx, ny] = vec(e); place(nx, ny); emit(nx, ny);
  });
  // Track move/up on `window`, not the element: on mobile Safari the
  // element's pointerup is occasionally dropped when pointer capture is
  // lost mid-drag, which left the drive joystick stuck "on" after the
  // finger lifted. window always sees the up/cancel for our pointer.
  function onMoveWin(e) {
    if (!dragging || e.pointerId !== pid) return;
    const [nx, ny] = vec(e); place(nx, ny); emit(nx, ny);
  }
  function release(e) {
    if (!dragging || (e && e.pointerId != null && e.pointerId !== pid)) return;
    dragging = false;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    pending = null;
    try { el.releasePointerCapture(pid); } catch (_) {}
    el.classList.remove('dragging');
    center();
    if (onEnd) onEnd();
  }
  window.addEventListener('pointermove', onMoveWin);
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  // OS/browser yanks capture (app switch, gesture) without a pointerup:
  // force a release so the car can't keep driving on its own.
  el.addEventListener('lostpointercapture', release);

  return {
    isDragging: () => dragging,
    place,                 // move the knob without emitting onMove
    center,
  };
}

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

// ── Drive joystick — momentary, spring-back, keyboard only when focused ───────
const driveEl   = document.getElementById('drive-joy');
const driveHint = document.getElementById('drive-hint');
let driveCmd = null;                       // last {left,right} dispatched

function driveMix(nx, ny) {
  // Arcade mixing. Up = forward (ny < 0); x = turn. Full-rim deflection
  // still reaches DUTY (full-left → {+DUTY,-DUTY}, full-fwd → {+DUTY,+DUTY}),
  // but `expo` makes the approach to it gradual instead of near-binary.
  if (Math.hypot(nx, ny) < 0.10) return { left: 0, right: 0 };   // center deadzone
  let throttle = curve(-ny, DRIVE_EXPO);
  let turn     = curve(nx, TURN_EXPO) * TURN_GAIN;
  let l = throttle - turn, r = throttle + turn;
  const m = Math.max(1, Math.abs(l), Math.abs(r));
  return { left: Math.round(l / m * DUTY), right: Math.round(r / m * DUTY) };
}
function driveSend(nx, ny) {
  const cmd = driveMix(nx, ny);
  const changed = !driveCmd || cmd.left !== driveCmd.left || cmd.right !== driveCmd.right;
  driveCmd = cmd;
  if (changed) post('/api/drive', cmd);
  if (!driveTimer) driveTimer = setInterval(() => {
    if (driveCmd) post('/api/drive', driveCmd);   // dead-man heartbeat
  }, 150);
}
function driveStop() {
  driveCmd = null;
  clearInterval(driveTimer); driveTimer = null;
  post('/api/stop');
}
const driveJoy = makeJoystick(driveEl, { onMove: driveSend, onEnd: driveStop });

// Keyboard control is intentionally scoped to the joystick element: arrow
// keys only steer the car while this joystick is focused (click/tab to it).
const ARROWS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
const held = new Set();
let kbActive = false;
function kbVec() {
  let x = 0, y = 0;
  if (held.has('ArrowUp'))    y -= 1;
  if (held.has('ArrowDown'))  y += 1;
  if (held.has('ArrowLeft'))  x -= 1;
  if (held.has('ArrowRight')) x += 1;
  const m = Math.hypot(x, y) || 1;            // normalize so diagonals aren't faster
  return [x / m, y / m];
}
function kbApply() {
  if (held.size === 0) {
    if (kbActive) { kbActive = false; driveJoy.center(); driveStop(); }
    return;
  }
  const [nx, ny] = kbVec();
  kbActive = true;
  driveJoy.place(nx, ny);
  driveSend(nx, ny);
}
driveEl.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); held.clear(); kbApply(); return; }
  if (!ARROWS.includes(e.key)) return;
  e.preventDefault();
  if (e.repeat) return;
  held.add(e.key); kbApply();
});
driveEl.addEventListener('keyup', e => {
  if (!ARROWS.includes(e.key)) return;
  e.preventDefault();
  held.delete(e.key); kbApply();
});
driveEl.addEventListener('focus', () => {
  driveEl.classList.add('focused');
  driveHint.textContent = 'Drive · arrow keys active';
});
driveEl.addEventListener('blur', () => {
  driveEl.classList.remove('focused');
  driveHint.textContent = 'Drive · tap to focus';
  if (kbActive || held.size) { held.clear(); kbActive = false; driveJoy.center(); driveStop(); }
});

// Backgrounding the app / hiding the tab mid-drive can withhold the
// pointerup on mobile. Force the car to stop the moment we lose the page.
function driveKill() {
  if (!driveCmd && !held.size && !driveJoy.isDragging()) return;
  held.clear(); kbActive = false; driveJoy.center(); driveStop();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') driveKill();
});
window.addEventListener('pagehide', driveKill);

// ── Camera/US-bracket joystick — spring-back; sends degrees; telemetry-synced ─
const camJoyEl = document.getElementById('cam-joy');
const panSpan  = document.getElementById('pan-v');
const tiltSpan = document.getElementById('tilt-v');
let camPan = 90, camTilt = 90, camTouchedAt = 0;

function camShow(p, t) { panSpan.textContent = p; tiltSpan.textContent = t; }
function camSend(nx, ny) {
  camTouchedAt = performance.now();
  const p = Math.round(clamp(90 + nx * 90, 0, 180));
  const t = Math.round(clamp(90 - ny * 90, 0, 180));
  if (p !== camPan)  { camPan  = p; post('/api/pan',  { angle: p }); }
  if (t !== camTilt) { camTilt = t; post('/api/tilt', { angle: t }); }
  camShow(camPan, camTilt);
}
// Spring-back: releasing the bracket joystick re-centers pan/tilt so the
// ultrasonic sensor faces forward again. Replaces the supervisor's old
// brittle distance-estimated auto-center after forward driving.
function camRecenter() {
  camTouchedAt = performance.now();
  if (camPan  !== 90) { camPan  = 90; post('/api/pan',  { angle: 90 }); }
  if (camTilt !== 90) { camTilt = 90; post('/api/tilt', { angle: 90 }); }
  camShow(90, 90);
}
const camJoy = makeJoystick(camJoyEl, { onMove: camSend, onEnd: camRecenter });

// Mirror the bracket's real angle reported by telemetry so the knob
// reflects the actual servo position on page load / reconnect.
// Suppressed while the user is (or just was) interacting so we never
// fight live input.
function camSync(p, t) {
  if (p == null || t == null || camJoy.isDragging()) return;
  if (performance.now() - camTouchedAt < 700) return;
  const rp = Math.round(p), rt = Math.round(t);
  if (rp === camPan && rt === camTilt) return;
  camPan = rp; camTilt = rt;
  camJoy.place((rp - 90) / 90, -(rt - 90) / 90);
  camShow(rp, rt);
}

// ── Express ───────────────────────────────────────────────────────────────────
// One unified, randomized "expression": LEDs and buzzer play together
// (lights track pitch and vice-versa). It needs tight timing so it runs
// server-side (see supervisor.rs); the button just triggers it and
// self-disables while it plays.
(() => {
  const btn = document.getElementById('b-express');
  btn.addEventListener('click', () => {
    if (btn.disabled) return;
    btn.disabled = true;
    post('/api/express');
    setTimeout(() => { btn.disabled = false; }, 3600);
  });
})();

// ── Sensor config ─────────────────────────────────────────────────────────────
function sendConfig() {
  post('/api/sensors/config', {
    light: document.getElementById('en-light').checked,
    ir:    document.getElementById('en-ir').checked,
    us:    document.getElementById('en-us').checked,
  });
}

// Sync mobile strips ↔ desktop sidebar
function syncCheckbox(desktopId, mobileId) {
  const d = document.getElementById(desktopId);
  const m = document.getElementById(mobileId);
  if (d) d.addEventListener('change', () => { if (m) m.checked = d.checked; sendConfig(); });
  if (m) m.addEventListener('change', () => { if (d) d.checked = m.checked; sendConfig(); });
}
syncCheckbox('en-light', 'en-light-m');
syncCheckbox('en-ir',    'en-ir-m');
syncCheckbox('en-us',    'en-us-m');

// ── SSE sensor stream ─────────────────────────────────────────────────────────
const conn = document.getElementById('conn');
const sse  = new EventSource('/api/sensors/stream');
sse.onopen  = () => { conn.textContent = 'connected'; conn.className = 'ok'; };
sse.onerror = () => { conn.textContent = 'disconnected'; conn.className = 'err'; };
sse.onmessage = e => {
  const d = JSON.parse(e.data);
  const fmt = (v, n) => v != null ? v.toFixed(n) : '—';

  // Keep the camera joystick in sync with the bracket's real angle.
  camSync(d.pan, d.tilt);

  // Onboard camera FPS (from SSE)
  const ofps = d.camera_fps != null ? d.camera_fps.toFixed(1) : '—';
  document.getElementById('v-cam-ofps').textContent   = ofps;
  document.getElementById('v-cam-ofps-m').textContent = ofps;

  // Exposure readback
  if (d.luma != null)        document.getElementById('v-luma').textContent = d.luma;
  if (d.brightness != null)  document.getElementById('v-bri').textContent  = d.brightness.toFixed(2);
  if (d.exposure_us != null) document.getElementById('v-exp').textContent  = (d.exposure_us / 1000).toFixed(1);
  if (d.gain != null)        document.getElementById('v-gain').textContent = d.gain.toFixed(1);

  // Update desktop sidebar IDs (also read by Playwright at 1280px)
  document.getElementById('v-bat').textContent     = fmt(d.battery_v, 2);
  document.getElementById('v-bat-pct').textContent = d.battery_pct != null ? d.battery_pct + '%' : '—%';
  document.getElementById('v-ll').textContent  = fmt(d.light_left, 2);
  document.getElementById('v-lr').textContent  = fmt(d.light_right, 2);
  document.getElementById('v-us').textContent  = fmt(d.us_cm, 1);
  {
    const ttc = d.ttc_s;
    const txt = ttc != null ? ttc.toFixed(1) : '—';
    const col = ttc == null ? '' : ttc < 1 ? 'var(--err)' : ttc < 2 ? 'var(--warn)' : 'var(--ok)';
    ['v-ttc','v-ttc-m'].forEach(id => {
      const el = document.getElementById(id);
      el.textContent = txt;
      el.style.color = col;
    });
  }
  if (d.ir) {
    document.getElementById('ir-l').className = 'dot' + (d.ir[0] ? ' on' : '');
    document.getElementById('ir-c').className = 'dot' + (d.ir[1] ? ' on' : '');
    document.getElementById('ir-r').className = 'dot' + (d.ir[2] ? ' on' : '');
  } else {
    ['ir-l','ir-c','ir-r'].forEach(id => document.getElementById(id).className = 'dot');
  }

  // Update mobile strip IDs
  document.getElementById('v-bat-m').textContent     = fmt(d.battery_v, 2);
  document.getElementById('v-bat-pct-m').textContent = d.battery_pct != null ? d.battery_pct + '%' : '—%';
  document.getElementById('v-ll-m').textContent  = fmt(d.light_left, 2);
  document.getElementById('v-lr-m').textContent  = fmt(d.light_right, 2);
  document.getElementById('v-us-m').textContent  = fmt(d.us_cm, 1);
  if (d.ir) {
    document.getElementById('ir-l-m').className = 'dot' + (d.ir[0] ? ' on' : '');
    document.getElementById('ir-c-m').className = 'dot' + (d.ir[1] ? ' on' : '');
    document.getElementById('ir-r-m').className = 'dot' + (d.ir[2] ? ' on' : '');
  } else {
    ['ir-l-m','ir-c-m','ir-r-m'].forEach(id => document.getElementById(id).className = 'dot');
  }
};

// ── Camera H.264 stream via WebRTC ────────────────────────────────────────────
//
// Server (webrtc_stream.rs) runs ffmpeg with h264_v4l2m2m (Pi HW encoder),
// parses Annex-B NAL access units, and pushes them into a
// TrackLocalStaticSample. The browser negotiates a recv-only video
// PeerConnection via a single POST/SDP-answer ("WHEP") exchange.
const camEl = document.getElementById('cam');
let _wFrames = 0, _wT0 = performance.now(), _wFps = 0;

function updateWebFps() {
  const now = performance.now();
  const dt = (now - _wT0) / 1000;
  if (dt >= 0.5) {
    _wFps = _wFps === 0 ? _wFrames / dt : 0.3 * (_wFrames / dt) + 0.7 * _wFps;
    _wFrames = 0; _wT0 = now;
    const txt = _wFps.toFixed(1);
    document.getElementById('v-cam-wfps').textContent   = txt;
    document.getElementById('v-cam-wfps-m').textContent = txt;
  }
}

function tickFrame(_now, _meta) {
  _wFrames++;
  updateWebFps();
  camEl.requestVideoFrameCallback(tickFrame);
}
if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
  camEl.requestVideoFrameCallback(tickFrame);
}

async function startStream() {
  while (true) {
    try {
      await runWebRTC();
    } catch (e) {
      console.warn('webrtc error, reconnecting in 1s', e);
    }
    await new Promise(r => setTimeout(r, 1000));
  }
}

function runWebRTC() {
  return new Promise(async (resolve, reject) => {
    const pc = new RTCPeerConnection();
    window.__pc = pc; // expose for debugging / latency probes
    pc.addTransceiver('video', { direction: 'recvonly' });

    pc.ontrack = (event) => {
      // First track event wires the stream to the <video>.
      if (camEl.srcObject !== event.streams[0]) {
        camEl.srcObject = event.streams[0];
      }
    };

    pc.oniceconnectionstatechange = () => {
      const s = pc.iceConnectionState;
      if (s === 'failed' || s === 'disconnected' || s === 'closed') {
        try { pc.close(); } catch (_) {}
        resolve();
      }
    };

    let offer;
    try {
      offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      // Wait for ICE gathering to complete so our offer includes candidates.
      await new Promise(r => {
        if (pc.iceGatheringState === 'complete') return r();
        const cb = () => {
          if (pc.iceGatheringState === 'complete') {
            pc.removeEventListener('icegatheringstatechange', cb);
            r();
          }
        };
        pc.addEventListener('icegatheringstatechange', cb);
      });
    } catch (e) { reject(e); return; }

    let answerSdp;
    try {
      const resp = await fetch('/api/webrtc/whep', {
        method: 'POST',
        headers: { 'Content-Type': 'application/sdp' },
        body: pc.localDescription.sdp,
      });
      if (!resp.ok) { reject(new Error('WHEP HTTP ' + resp.status)); return; }
      answerSdp = await resp.text();
    } catch (e) { reject(e); return; }

    try {
      await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
    } catch (e) { reject(e); return; }
    // Promise stays pending until the ICE state turns terminal.
  });
}

startStream();

// ── SLAM feature overlay ──────────────────────────────────────────────────────
// Draws /api/slam/stream points over the video. The video uses
// object-fit:contain, so we letterbox-map detector (level-0) coords into
// the displayed image rect and keep the canvas aligned to the <video>.
(() => {
  const wrap   = document.getElementById('cam-wrap');
  const camEl  = document.getElementById('cam');
  const canvas = document.getElementById('feat-overlay');
  const ctx    = canvas.getContext('2d');
  const modeSel = document.getElementById('feat-mode');
  const stat   = document.getElementById('feat-stat');
  const mapCanvas = document.getElementById('slam-map');
  const mctx   = mapCanvas.getContext('2d');
  let snap = null;

  const es = new EventSource('/api/slam/stream');
  es.onmessage = e => { try { snap = JSON.parse(e.data); } catch (_) {} };
  es.onerror = () => {};

  // Two-view bootstrap map, polled (cheap, only meaningful once init runs).
  let mapData = null;
  setInterval(async () => {
    try { mapData = await (await fetch('/api/slam/map')).json(); } catch (_) {}
  }, 500);

  // Distinct-ish colour per pyramid level.
  const levelColor = l => `hsl(${(l * 40) % 360} 90% 60%)`;

  function frame() {
    const mode = modeSel.value;
    // Align the canvas to the <video> box within the positioned wrap.
    const cr = camEl.getBoundingClientRect();
    const wr = wrap.getBoundingClientRect();
    const bw = cr.width, bh = cr.height;
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(bw * dpr) || canvas.height !== Math.round(bh * dpr)) {
      canvas.width = Math.round(bw * dpr);
      canvas.height = Math.round(bh * dpr);
    }
    canvas.style.left = (cr.left - wr.left) + 'px';
    canvas.style.top  = (cr.top  - wr.top) + 'px';
    canvas.style.width = bw + 'px';
    canvas.style.height = bh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, bw, bh);

    // Top-down (x, z) two-view bootstrap map from /api/slam/map.
    if (mode === 'map') {
      mapCanvas.style.display = 'block';
      const S = 220, d2 = window.devicePixelRatio || 1;
      if (mapCanvas.width !== Math.round(S * d2)) {
        mapCanvas.width = Math.round(S * d2);
        mapCanvas.height = Math.round(S * d2);
        mapCanvas.style.width = S + 'px';
        mapCanvas.style.height = S + 'px';
      }
      mctx.setTransform(d2, 0, 0, d2, 0, 0);
      mctx.clearRect(0, 0, S, S);
      mctx.fillStyle = '#9cf';
      mctx.font = '10px monospace';
      mctx.fillText('top-down map (x→, z↑)', 8, 12);

      const md = mapData;
      const pts = md && md.points || [];
      const cams = md && md.cameras || [];
      const kfs = md && md.keyframes || [];
      if (pts.length || cams.length) {
        // Uniform fit of all points + camera/keyframe centres, z up.
        const all = pts.concat(cams, kfs);
        let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
        for (const [x, z] of all) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
        }
        const pad = 22, span = Math.max(maxX - minX, maxZ - minZ, 1e-6);
        const sc = (S - 2 * pad) / span;
        const cx0 = (minX + maxX) / 2, cz0 = (minZ + maxZ) / 2;
        const PX = x => S / 2 + (x - cx0) * sc;
        const PY = z => S / 2 - (z - cz0) * sc;
        mctx.fillStyle = 'rgba(120,200,255,.65)';
        for (const [x, z] of pts) {
          mctx.beginPath();
          mctx.arc(PX(x), PY(z), 1.4, 0, 6.283);
          mctx.fill();
        }
        // Camera-centre trajectory: polyline + faint waypoints, start
        // green, current (newest) yellow + larger.
        if (cams.length >= 2) {
          mctx.strokeStyle = 'rgba(255,255,255,.55)';
          mctx.beginPath();
          mctx.moveTo(PX(cams[0][0]), PY(cams[0][1]));
          for (let i = 1; i < cams.length; i++) mctx.lineTo(PX(cams[i][0]), PY(cams[i][1]));
          mctx.stroke();
        }
        cams.forEach(([x, z], i) => {
          const last = i === cams.length - 1;
          mctx.fillStyle = i === 0 ? '#3cff78' : last ? '#fd6' : 'rgba(150,200,255,.5)';
          mctx.beginPath();
          mctx.arc(PX(x), PY(z), last ? 3.6 : 1.6, 0, 6.283);
          mctx.fill();
        });
        // Keyframes (M5): orange squares — the BA-refined subset the
        // local map is built on.
        mctx.fillStyle = 'rgba(255,170,60,.9)';
        for (const [x, z] of kfs) mctx.fillRect(PX(x) - 2.2, PY(z) - 2.2, 4.4, 4.4);
      }
      const status = md && md.status || 'no map yet';
      mctx.fillStyle = '#9cf';
      mctx.fillText(status.slice(0, 48), 8, S - 8);
      stat.textContent = 'map · ' + status;
      requestAnimationFrame(frame);
      return;
    }
    mapCanvas.style.display = 'none';

    if (mode === 'off' || !snap || !snap.width || !snap.points) {
      stat.textContent = mode === 'off' ? 'off' : '—';
      requestAnimationFrame(frame);
      return;
    }

    // object-fit:contain letterbox of the detector image in the box.
    const s = Math.min(bw / snap.width, bh / snap.height);
    const ox = (bw - snap.width * s) / 2;
    const oy = (bh - snap.height * s) / 2;
    const X = p => ox + p.x * s, Y = p => oy + p.y * s;

    const showOrient = mode === 'orient' || mode === 'both';
    const showMatch  = mode === 'match'  || mode === 'both';
    const pts = mode === '300' ? snap.points.slice(0, 300) : snap.points;

    // Keypoint dots, coloured by pyramid level.
    for (const p of pts) {
      ctx.beginPath();
      ctx.arc(X(p), Y(p), 2.2, 0, 6.283);
      ctx.fillStyle = levelColor(p.level);
      ctx.fill();
    }

    // Orientation ticks: the BRIEF steering angle per keypoint.
    if (showOrient) {
      ctx.strokeStyle = 'rgba(255,255,255,.8)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (const p of pts) {
        const a = p.angle || 0, L = 9;
        ctx.moveTo(X(p), Y(p));
        ctx.lineTo(X(p) + Math.cos(a) * L, Y(p) + Math.sin(a) * L);
      }
      ctx.stroke();
    }

    // Descriptor matches to the previous frame.
    const ms = snap.matches || [];
    if (showMatch) {
      ctx.strokeStyle = 'rgba(60,255,120,.7)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (const m of ms) {
        ctx.moveTo(ox + m.x0 * s, oy + m.y0 * s);
        ctx.lineTo(ox + m.x1 * s, oy + m.y1 * s);
      }
      ctx.stroke();
    }

    const mtxt = showMatch ? ` · ${ms.length} match` : '';
    const kept = snap.n_kept != null ? snap.n_kept : pts.length;
    const ci = snap.intrinsics;
    const cal = ci && ci.fx
      ? `\ncal f${ci.fx.toFixed(0)} ${ci.fov_deg.toFixed(0)}° ` +
        (ci.verified ? 'OK' : 'UNVERIFIED')
      : '';
    const st = snap.stages;
    const brk = st
      ? `\ngr${st.gray.toFixed(0)} py${st.pyramid.toFixed(0)} fa${st.fast.toFixed(0)} ` +
        `bl${st.blur.toFixed(0)} or${st.orient.toFixed(0)} ds${st.describe.toFixed(0)} ` +
        `mt${st.matching.toFixed(0)}`
      : '';
    stat.textContent =
      `${kept}/${snap.n_total}${mtxt} · ${snap.detect_ms.toFixed(0)}ms · ` +
      `${snap.fps.toFixed(1)}f/s${brk}${cal}`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
