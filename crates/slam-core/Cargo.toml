[package]
name = "ginger-slam-core"
version = "0.1.0"
edition = "2024"

# Dependency-light and camera-free (like ginger-fast) so the geometry /
# optimization math cross-compiles and unit-tests without libcamera:
#   cargo test  -p ginger-slam-core
#   cargo check -p ginger-slam-core --target aarch64-unknown-linux-gnu
[dependencies]
# Seeded RNG for RANSAC, k-means++, and synthetic test fixtures.
# `SmallRng` (Xoshiro256++) plus `Rng::random_range` (Lemire-debiased)
# is reproducible within a build and statistically nicer than the
# hand-rolled xorshift it replaced; cross-`rand`-version byte
# stability is not promised, and per the test audit (see PLAN.md)
# nothing in this crate's tests asserts on specific bit sequences.
rand = "0.10"
nalgebra = "0.34"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Compact binary (de)serialization for the BoW vocabulary asset; small,
# no_std-friendly, serde-based — keeps the crate dependency-light.
postcard = { version = "1", features = ["alloc"] }
