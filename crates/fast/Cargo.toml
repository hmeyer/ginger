[package]
name = "ginger-fast"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1"

# Test-only: the deterministic image-fuzz fixtures use `SmallRng`
# (Xoshiro256++) seeded with a fixed `u64`, which is enough for the
# scalar-vs-NEON parity tests. Kept a dev-dependency so the crate's
# runtime dep surface stays minimal.
[dev-dependencies]
rand = "0.10"
