name: RPi build

# Builds the deployable `ginger` binary (full default features, libcamera
# on) for the Raspberry Pi and uploads it as a workflow artifact, so the Pi
# can download a ready-made binary instead of compiling locally.
#
# The Pi pulls it with `scripts/pull-binary.sh`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rpi-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # libcamera version installed on the target Raspberry Pi (Raspberry Pi
  # OS Trixie). The deployed binary dynamically links libcamera, whose
  # ABI / soname is version-specific, so the build must link the *same*
  # build the Pi runs. Keep this equal to `dpkg -l libcamera0.7` on the
  # Pi; bump it (and redeploy) whenever the Pi's libcamera is upgraded.
  #
  # If this exact version has rotated out of the Raspberry Pi apt pool the
  # install step fails loudly — bump the pin to the Pi's current version
  # (or `apt full-upgrade` the Pi to a version still in the pool).
  LIBCAMERA_VERSION: 0.7.0+rpt20260205-1

jobs:
  build:
    name: Build ginger (aarch64, libcamera)
    # Free GitHub-hosted arm64 runner (public repo) — native aarch64, no
    # cross-compilation. The Debian Trixie container matches Raspberry Pi
    # OS Trixie: same glibc (2.41), and the Raspberry Pi apt archive's
    # libcamera packages install cleanly into it.
    runs-on: ubuntu-24.04-arm
    container: debian:trixie-slim

    steps:
      - name: Install build dependencies
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl git file \
            build-essential pkg-config cmake \
            clang libclang-dev \
            libv4l-dev libudev-dev
          # Raspberry Pi apt archive — source of the exact libcamera build
          # the Pi runs, so the linked ABI matches. Marked `trusted=yes`
          # because Debian Trixie's apt (Sequoia/sqv) rejects the rpi
          # archive's SHA1-self-signed GPG key under its 2026-02-01
          # hardening (rpi has not yet republished a SHA256 key). The
          # container is ephemeral, the URL is HTTPS, and the final
          # binary is verified end-to-end via SHA-256 by the Pi-side pull
          # script, so skipping apt-level signature verification on this
          # one archive is an acceptable trade.
          echo "deb [trusted=yes] https://archive.raspberrypi.com/debian trixie main" \
            > /etc/apt/sources.list.d/raspberrypi.list
          apt-get update -qq
          # libcamera-dev depends on the exact-versioned runtime package,
          # so pinning the -dev package pulls a matching libcamera0.7.
          apt-get install -y --no-install-recommends \
            "libcamera-dev=${LIBCAMERA_VERSION}"

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Native aarch64 release build. `.cargo/config.toml` applies the
      # cortex-a72 tuning because the host triple is the build target.
      - name: Build release binary
        run: cargo build --release --bin ginger

      - name: Package binary + checksum
        run: |
          set -eux
          mkdir -p dist
          cp target/release/ginger dist/ginger
          ( cd dist && sha256sum ginger > ginger.sha256 )
          file dist/ginger

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ginger-aarch64
          path: dist/
          retention-days: 90
          if-no-files-found: error
