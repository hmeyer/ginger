name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 ships libcamera 0.2.0; the Rust crate requires >= 0.4.0.
      # Build 0.4.0 from source and cache the install tree.
      - name: Cache libcamera
        id: libcamera-cache
        uses: actions/cache@v4
        with:
          path: /opt/libcamera
          key: libcamera-0.4.0-${{ runner.os }}

      - name: Install libcamera build deps
        if: steps.libcamera-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build \
            python3-yaml python3-ply python3-jinja2 \
            libudev-dev

      - name: Build libcamera 0.4.0 from source
        if: steps.libcamera-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v0.4.0 \
            https://git.libcamera.org/libcamera/libcamera.git lc-src
          meson setup lc-src/build lc-src \
            --prefix=/opt/libcamera \
            -Dgstreamer=disabled \
            -Dlc-compliance=disabled \
            -Dcam=disabled \
            -Dqcam=disabled \
            -Ddocumentation=disabled \
            -Dtest=false
          ninja -C lc-src/build
          ninja -C lc-src/build install

      - name: Set libcamera env paths
        run: |
          # meson installs .pc files under lib/ or lib/<arch>/pkgconfig/
          echo "PKG_CONFIG_PATH=/opt/libcamera/lib/pkgconfig:/opt/libcamera/lib/x86_64-linux-gnu/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/libcamera/lib:/opt/libcamera/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV

      # bindgen (via libcamera-sys) only needs libclang at build time,
      # and clang-sys honours LIBCLANG_PATH. The runner already ships
      # LLVM 16/17/18, so point bindgen at the preinstalled toolchain
      # instead of apt-installing the whole libclang-dev tree (~7 min).
      # Fall back to apt only if libclang is somehow absent, so this can
      # never be slower than the previous unconditional install.
      - name: Provide libclang for bindgen
        run: |
          set -eu
          found=""
          for d in \
            "$(llvm-config-18 --libdir 2>/dev/null || true)" \
            "$(llvm-config --libdir 2>/dev/null || true)" \
            /usr/lib/llvm-18/lib /usr/lib/llvm-17/lib /usr/lib/llvm-16/lib \
            /usr/lib/x86_64-linux-gnu; do
            if [ -n "$d" ] && ls "$d"/libclang*.so* >/dev/null 2>&1; then
              found="$d"; break
            fi
          done
          if [ -n "$found" ]; then
            echo "Using preinstalled libclang at $found"
            echo "LIBCLANG_PATH=$found" >> "$GITHUB_ENV"
          else
            echo "Preinstalled libclang not found; installing libclang-dev"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libclang-dev
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: make lint

  headless:
    name: Headless (mock camera)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `--no-default-features` drops libcamera and swaps in the mock
      # camera, so the whole crate (server, SLAM frontend, replay
      # harness) builds and tests headless — no from-source libcamera.
      - name: Test + clippy (no libcamera)
        run: |
          cargo test --workspace --no-default-features
          cargo clippy --workspace --no-default-features --all-targets -- -D warnings

      # Deterministic replay-harness smoke over generated PGM frames.
      - name: Replay harness smoke
        run: |
          mkdir -p /tmp/rt
          python3 - <<'PY'
          W,H=96,72
          for f in range(5):
              b=bytearray()
              for y in range(H):
                  for x in range(W):
                      b.append(min(255,((((x+f*3)//8)+(y//8))%2)*200+((x*7+y*13+f*5)%40)))
              open(f"/tmp/rt/frame_{f:04d}.pgm","wb").write(b"P5\n%d %d\n255\n"%(W,H)+bytes(b))
          PY
          cargo run --no-default-features --example slam_replay -- /tmp/rt

  aarch64-check:
    name: aarch64 cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      # Compile-only check of the NEON / geometry paths. `ginger-fast`
      # and `ginger-slam-core` are dependency-light (no libcamera/v4l,
      # no linker — cargo check does not link). Correctness is verified
      # by the differential / unit tests run natively + in `headless`.
      - run: cargo check -p ginger-fast --target aarch64-unknown-linux-gnu
      - run: cargo check -p ginger-slam-core --target aarch64-unknown-linux-gnu

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Date in the key so a fresh cache is saved daily; restore-keys
      # seeds from the most recent prior cache. cargo-audit still
      # `git fetch`es the advisory DB on every run, so the audit stays
      # current — caching only skips the full clone, not the freshness.
      - name: Cache RustSec advisory DB
        id: advisory-db-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ runner.os }}-${{ steps.advisory-db-date.outputs.date }}
          restore-keys: |
            advisory-db-${{ runner.os }}-

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2024-0436: `paste` is unmaintained (build-time
          # proc-macro, no runtime/security surface), pulled in only via
          # nalgebra → simba → paste. Not a vulnerability; mirrored in
          # .cargo/audit.toml for local `make audit` parity. Revisit
          # when nalgebra/simba drop the dependency.
          ignore: RUSTSEC-2024-0436
