name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  headless:
    name: Headless (mock camera, native aarch64)
    # Native aarch64 runner so the crates/fast NEON paths actually
    # execute in tests. On x86 only the scalar reference ran and the
    # `parity` tests compared the scalar to itself.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: headless-arm

      - name: fmt --check
        run: cargo fmt --check

      # `--no-default-features` drops libcamera and swaps in the mock
      # camera, so the whole crate (server, SLAM frontend, replay
      # harness) builds and tests headless on a bare runner — no
      # libcamera install needed here.
      - name: Test + clippy (no libcamera)
        run: |
          cargo test --workspace --no-default-features
          cargo clippy --workspace --no-default-features --all-targets -- -D warnings

      # Deterministic replay-harness smoke over generated PGM frames.
      - name: Replay harness smoke
        run: |
          mkdir -p /tmp/rt
          python3 - <<'PY'
          W,H=96,72
          for f in range(5):
              b=bytearray()
              for y in range(H):
                  for x in range(W):
                      b.append(min(255,((((x+f*3)//8)+(y//8))%2)*200+((x*7+y*13+f*5)%40)))
              open(f"/tmp/rt/frame_{f:04d}.pgm","wb").write(b"P5\n%d %d\n255\n"%(W,H)+bytes(b))
          PY
          cargo run --no-default-features --example slam_replay -- /tmp/rt

  build:
    name: Build + clippy ginger (aarch64, libcamera)
    # Native aarch64 + Debian Trixie container so we link against the
    # exact Raspberry Pi libcamera the deployed binary will load. This
    # is also the only job in CI with libcamera headers, so the
    # default-features clippy runs here too (replacing the old `lint`
    # job's from-source libcamera 0.4 build).
    runs-on: ubuntu-24.04-arm
    container: debian:trixie-slim
    env:
      # libcamera version installed on the target Raspberry Pi (Raspberry
      # Pi OS Trixie). The deployed binary dynamically links libcamera,
      # whose ABI / soname is version-specific, so the build must link
      # the *same* build the Pi runs. Keep this equal to `dpkg -l
      # libcamera0.7` on the Pi; bump it (and `sudo apt full-upgrade`
      # the Pi) whenever the rpi apt pool rotates — it drops dated
      # builds quickly, so the Pi and this pin must move together or
      # the install step below 404s.
      LIBCAMERA_VERSION: 0.7.1+rpt20260429-1
    steps:
      - name: Install build dependencies
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl git file \
            build-essential pkg-config cmake \
            clang libclang-dev \
            libv4l-dev libudev-dev
          # Raspberry Pi apt archive — source of the exact libcamera build
          # the Pi runs, so the linked ABI matches. Marked `trusted=yes`
          # because Debian Trixie's apt (Sequoia/sqv) rejects the rpi
          # archive's SHA1-self-signed GPG key under its 2026-02-01
          # hardening (rpi has not yet republished a SHA256 key). The
          # container is ephemeral, the URL is HTTPS, and the final
          # binary is verified end-to-end via SHA-256 by the Pi-side pull
          # script, so skipping apt-level signature verification on this
          # one archive is an acceptable trade.
          echo "deb [trusted=yes] https://archive.raspberrypi.com/debian trixie main" \
            > /etc/apt/sources.list.d/raspberrypi.list
          apt-get update -qq
          # libcamera-dev depends on the exact-versioned runtime package,
          # so pinning the -dev package pulls a matching libcamera0.7.
          apt-get install -y --no-install-recommends \
            "libcamera-dev=${LIBCAMERA_VERSION}"

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-arm

      # Default-features clippy — only place in CI with libcamera headers.
      # `--release` matches the build profile below so target/ is reused.
      - name: Clippy (libcamera default features)
        run: cargo clippy --release --workspace --all-targets -- -D warnings

      # Native aarch64 release build. `.cargo/config.toml` applies the
      # cortex-a72 tuning because the host triple is the build target.
      - name: Build release binary
        run: cargo build --release --bin ginger

      - name: Package binary + checksum
        run: |
          set -eux
          mkdir -p dist
          cp target/release/ginger dist/ginger
          ( cd dist && sha256sum ginger > ginger.sha256 )
          file dist/ginger

      # Only publish artifacts from main; the Pi-side pull script
      # (scripts/pull-binary.sh) reads from main. Skipping uploads on
      # PRs avoids retaining a binary per push.
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ginger-aarch64
          path: dist/
          retention-days: 90
          if-no-files-found: error

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Date in the key so a fresh cache is saved daily; restore-keys
      # seeds from the most recent prior cache. cargo-audit still
      # `git fetch`es the advisory DB on every run, so the audit stays
      # current — caching only skips the full clone, not the freshness.
      - name: Cache RustSec advisory DB
        id: advisory-db-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ runner.os }}-${{ steps.advisory-db-date.outputs.date }}
          restore-keys: |
            advisory-db-${{ runner.os }}-

      # Prebuilt cargo-audit binary — rustsec/audit-check compiled it
      # from source on every run (~minutes). taiki-e/install-action
      # downloads a release binary in seconds.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # RUSTSEC-2024-0436 (`paste` unmaintained — build-time proc-macro,
      # no runtime/security surface, via nalgebra → simba → paste) is
      # ignored through .cargo/audit.toml, the single source of truth
      # also used by local `make audit`. Revisit when simba drops it.
      - run: cargo audit
